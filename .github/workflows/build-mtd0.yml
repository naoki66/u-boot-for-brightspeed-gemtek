name: Build signed mtd0 bootloader

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".workbuddy/**"
      - "doc/**"
      - "README.md"
      - "LICENSE*"
      - "**/*.md"
      - "**/*.rst"
      - "**/*.svg"
  workflow_dispatch:
    inputs:
      board:
        description: Board to build (both builds xg2010g and xr1710g)
        required: true
        default: both
        type: choice
        options:
          - both
          - xg2010g
          - xr1710g
      release_type:
        description: Build only, create a pre-release, or create a release
        required: true
        default: test
        type: choice
        options:
          - test
          - pre-release
          - release

env:
  ARCH: arm
  AIROHA_ATF_REF: 94892b9e42eb1f6992e60bce904c3ef42ea995c8
  ATF_BASE_REF: v2.10
  BL2_TOOLCHAIN_NAME: arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi
  BL2_TOOLCHAIN_SHA256: 563bebb2b97d53382b956d6ee1fe61e2cae26699901417234a37df505ef9b5fa
  BL2_TOOLCHAIN_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi.tar.xz
  BL2_XMODEM_MAX_SIZE: "0x1f800"
  BL23_FIP_MAX_SIZE: "0x100000"
  BL33_LOAD_MAX_SIZE: "0x100000"
  BL_DECOMPRESS_INPUT_MAX_SIZE: "0x58000"
  CROSS_COMPILE: aarch64-linux-gnu-
  DEFAULT_FIP_ALIGN: "0x400"
  DEFAULT_FIP_OFFSET: "0x800"
  DEFAULT_MTD0_SIZE: "0x200000"
  DEFAULT_NTFW_NVCTR: "0"
  DEFAULT_TFW_NVCTR: "0"
  FIXED_TFA_REF: v2.13.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LZMA_SOURCE_SHA256: dcbdb5f4843eff638e4a5e8be0e2486a3c5483df73c70823618db8e66f609ec2
  LZMA_SOURCE_URL: https://sources.openwrt.org/lzma-4.65.tar.bz2
  MBEDTLS_REF: 72718dd87e087215ce9155a826ee5a66cfbe9631

permissions:
  contents: read

jobs:
  select-boards:
    name: Select boards to build
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.select.outputs.boards }}
    steps:
      - name: Resolve board selection
        id: select
        env:
          REQUESTED_BOARD: ${{ inputs.board }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BOARD="${REQUESTED_BOARD:-both}"
          else
            # push 触发时始终编译两块板
            BOARD="both"
          fi
          case "$BOARD" in
            both)
              boards='["xg2010g", "xr1710g"]'
              ;;
            xg2010g|xr1710g)
              boards="[\"${BOARD}\"]"
              ;;
            *)
              echo "Unsupported board selection: ${BOARD}" >&2
              exit 1
              ;;
          esac
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"
          echo "Boards to build: ${boards}"

  build:
    name: Build U-Boot and signed mtd0 (${{ matrix.board }})
    needs: select-boards
    # Per-matrix-leg concurrency: only cancel a build for the same board on the
    # same ref. Lives on the job rather than at workflow level because
    # GitHub Actions does not allow `matrix.*` expressions in the top-level
    # concurrency block.
    concurrency:
      group: build-mtd0-${{ github.workflow }}-${{ github.ref }}-${{ matrix.board }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.select-boards.outputs.boards) }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      bl31_name: ${{ steps.artifact.outputs.bl31_name }}
      build_mode: ${{ steps.mode.outputs.value }}
      commit: ${{ steps.version.outputs.commit }}
      fip_name: ${{ steps.artifact.outputs.fip_name }}
      mtd0_name: ${{ steps.artifact.outputs.mtd0_name }}
      preloader_name: ${{ steps.artifact.outputs.preloader_name }}
      release_date: ${{ steps.version.outputs.release_date }}
      recovery_fip_name: ${{ steps.artifact.outputs.recovery_fip_name }}
      tag: ${{ steps.artifact.outputs.tag }}
      uboot_raw_name: ${{ steps.artifact.outputs.uboot_raw_name }}

    steps:
      - name: Checkout U-Boot
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select build mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          MODE="${REQUESTED_MODE:-test}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            MODE="test"
          fi
          case "$MODE" in
            test|pre-release|release) ;;
            *)
              echo "Unsupported build mode: $MODE" >&2
              exit 1
              ;;
          esac
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      # Per-board parameters live under the upper-cased board name so that the
      # same workflow handles both XG2010G and XR1710G. Each board must
      # provide a matching ${BOARD_UPPER}_* set of GitHub Variables/Secrets
      # (see doc/board/airoha/xg2010g.rst and xr1710g.rst for the full list).
      # This step also pre-computes board_upper so that all later steps can
      # reference it via ${{ steps.board_ids.outputs.board_upper }}.
      - name: Record board identifier
        id: board_ids
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          board_upper=$(printf '%s' "$BOARD" | tr '[:lower:]' '[:upper:]')
          echo "board_upper=${board_upper}" >> "$GITHUB_OUTPUT"

      - name: Resolve per-board identifiers and parameters
        id: params
        env:
          BOARD: ${{ matrix.board }}
          # GitHub Actions expressions cannot concatenate strings to form a
          # vars/secrets indexer key. The DSL has no string-concat function,
          # so each per-board variable is enumerated by board name in env
          # and the shell picks the one matching $BOARD_UPPER. Add new
          # boards here AND extend the case statement below.
          FIP_ALIGN_XG2010G: ${{ vars.XG2010G_FIP_ALIGN }}
          FIP_ALIGN_XR1710G: ${{ vars.XR1710G_FIP_ALIGN }}
          FIP_OFFSET_XG2010G: ${{ vars.XG2010G_FIP_OFFSET }}
          FIP_OFFSET_XR1710G: ${{ vars.XR1710G_FIP_OFFSET }}
          MTD0_SIZE_XG2010G: ${{ vars.XG2010G_MTD0_SIZE }}
          MTD0_SIZE_XR1710G: ${{ vars.XR1710G_MTD0_SIZE }}
          NTFW_NVCTR_XG2010G: ${{ vars.XG2010G_NTFW_NVCTR }}
          NTFW_NVCTR_XR1710G: ${{ vars.XR1710G_NTFW_NVCTR }}
          TFW_NVCTR_XG2010G: ${{ vars.XG2010G_TFW_NVCTR }}
          TFW_NVCTR_XR1710G: ${{ vars.XR1710G_TFW_NVCTR }}
        run: |
          set -euo pipefail
          board_upper="${{ steps.board_ids.outputs.board_upper }}"

          case "$board_upper" in
            XG2010G)
              fip_align="${FIP_ALIGN_XG2010G:-}"
              fip_offset="${FIP_OFFSET_XG2010G:-}"
              mtd0_size="${MTD0_SIZE_XG2010G:-}"
              tfw_nvctr="${TFW_NVCTR_XG2010G:-}"
              ntfw_nvctr="${NTFW_NVCTR_XG2010G:-}"
              ;;
            XR1710G)
              fip_align="${FIP_ALIGN_XR1710G:-}"
              fip_offset="${FIP_OFFSET_XR1710G:-}"
              mtd0_size="${MTD0_SIZE_XR1710G:-}"
              tfw_nvctr="${TFW_NVCTR_XR1710G:-}"
              ntfw_nvctr="${NTFW_NVCTR_XR1710G:-}"
              ;;
            *)
              echo "Unknown board for params: ${board_upper}" >&2
              exit 1
              ;;
          esac

          tfa_ref="$FIXED_TFA_REF"

          mtd0_size="${mtd0_size:-$DEFAULT_MTD0_SIZE}"
          fip_offset="${fip_offset:-$DEFAULT_FIP_OFFSET}"
          fip_align="${fip_align:-$DEFAULT_FIP_ALIGN}"
          tfw_nvctr="${tfw_nvctr:-$DEFAULT_TFW_NVCTR}"
          ntfw_nvctr="${ntfw_nvctr:-$DEFAULT_NTFW_NVCTR}"

          mtd0_size_dec=$((mtd0_size))
          fip_offset_dec=$((fip_offset))
          fip_align_dec=$((fip_align))
          if (( mtd0_size_dec != 0x200000 )); then
            echo "${board_upper} mtd0 must stay 0x200000 bytes, got ${mtd0_size}" >&2
            exit 1
          fi
          if (( fip_offset_dec < 0 || fip_offset_dec >= mtd0_size_dec )); then
            echo "Invalid FIP offset ${fip_offset}" >&2
            exit 1
          fi
          if (( fip_align_dec < 1 )); then
            echo "Invalid FIP alignment ${fip_align}" >&2
            exit 1
          fi

          {
            echo "tfa_ref=${tfa_ref}"
            echo "mtd0_size=${mtd0_size}"
            echo "mtd0_size_dec=${mtd0_size_dec}"
            echo "fip_offset=${fip_offset}"
            echo "fip_offset_dec=${fip_offset_dec}"
            echo "fip_align=${fip_align}"
            echo "tfw_nvctr=${tfw_nvctr}"
            echo "ntfw_nvctr=${ntfw_nvctr}"
          } >> "$GITHUB_OUTPUT"

          echo "Board: ${BOARD} (${board_upper})"
          echo "TF-A ref: ${tfa_ref} (fixed)"
          echo "mtd0 size: ${mtd0_size}"
          echo "FIP offset: ${fip_offset}"
          echo "FIP payload alignment: ${fip_align}"
          echo "Signing: required"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bzip2 \
            build-essential \
            bison \
            flex \
            swig \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            libssl-dev \
            device-tree-compiler \
            bc \
            curl \
            git \
            openssl \
            rsync \
            xz-utils

      - name: Configure U-Boot
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          # GitHub runners are normally fresh, but keep the build deterministic
          # when this workflow is replayed on a reused workspace.
          make distclean
          make "${BOARD}_defconfig"

      - name: Build U-Boot
        run: |
          set -euo pipefail
          make -j"$(nproc)" all

      - name: Get version info
        id: version
        run: |
          set -euo pipefail
          commit_short=$(git rev-parse --short=12 HEAD)
          date_stamp=$(date +%Y%m%d)
          version=$(sed -n 's/.*PLAIN_VERSION "\(.*\)".*/\1/p' include/generated/version_autogenerated.h 2>/dev/null | head -1)
          if [ -z "$version" ]; then
            version=$(date +%Y.%m)
          fi
          release_date=$(date +%Y-%-m-%-d)
          {
            echo "commit=${commit_short}"
            echo "date=${date_stamp}"
            echo "version=${version}"
            echo "release_date=${release_date}"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed U-Boot version: ${version}"

      - name: Validate U-Boot output
        run: |
          set -euo pipefail
          test -f u-boot.bin
          ls -la u-boot.bin u-boot.img u-boot.dtb || true
          uboot_size=$(stat -c%s u-boot.bin)
          bl33_max_size=$((BL33_LOAD_MAX_SIZE))
          if (( uboot_size > bl33_max_size )); then
            echo "u-boot.bin is ${uboot_size} bytes; BL33 limit is ${bl33_max_size} bytes" >&2
            exit 1
          fi
          echo "u-boot.bin size: ${uboot_size} bytes"

      - name: Checkout TF-A tooling
        uses: actions/checkout@v7
        with:
          repository: ARM-software/arm-trusted-firmware
          ref: ${{ steps.params.outputs.tfa_ref }}
          path: trusted-firmware-a

      - name: Build fiptool and cert_create
        run: |
          set -euo pipefail
          make -C trusted-firmware-a PLAT=fvp fiptool certtool -j"$(nproc)"
          test -x trusted-firmware-a/tools/fiptool/fiptool
          test -x trusted-firmware-a/tools/cert_create/cert_create

      - name: Checkout TF-A v2.10 base
        uses: actions/checkout@v7
        with:
          repository: ARM-software/arm-trusted-firmware
          ref: ${{ env.ATF_BASE_REF }}
          path: trusted-firmware-a-build

      - name: Checkout Airoha TF-A overlay
        uses: actions/checkout@v7
        with:
          repository: Ansuel/atf-airoha
          ref: ${{ env.AIROHA_ATF_REF }}
          path: atf-airoha-overlay

      - name: Checkout Mbed TLS
        uses: actions/checkout@v7
        with:
          repository: Mbed-TLS/mbedtls
          ref: ${{ env.MBEDTLS_REF }}
          path: mbedtls-3.4.1

      # prepare-atf.py currently lives under xg2010g/atf/. It applies SoC-level
      # patches to Airoha's TF-A tree that are required for both boards, so it
      # is reused as a shared platform helper until an xr1710g/atf/ directory
      # exists. Move it to board/airoha/an7581/atf/ once XR1710G-specific
      # patches diverge.
      - name: Prepare Airoha TF-A source and host tools
        run: |
          set -euo pipefail
          rsync -a --checksum --exclude=.git/ atf-airoha-overlay/ trusted-firmware-a-build/
          python3 board/airoha/xg2010g/atf/prepare-atf.py trusted-firmware-a-build

          mkdir -p atf-tools/lzma-4.65
          curl -fsSL --retry 3 -o atf-tools/bl2-toolchain.tar.xz "$BL2_TOOLCHAIN_URL"
          printf '%s  %s\n' "$BL2_TOOLCHAIN_SHA256" atf-tools/bl2-toolchain.tar.xz | sha256sum -c -
          tar -C atf-tools -xf atf-tools/bl2-toolchain.tar.xz

          curl -fsSL --retry 3 -o atf-tools/lzma-4.65.tar.bz2 "$LZMA_SOURCE_URL"
          printf '%s  %s\n' "$LZMA_SOURCE_SHA256" atf-tools/lzma-4.65.tar.bz2 | sha256sum -c -
          tar -C atf-tools/lzma-4.65 --strip-components=1 -xjf atf-tools/lzma-4.65.tar.bz2
          make -C atf-tools/lzma-4.65/CPP/7zip/Compress/LZMA_Alone -f makefile.gcc -j"$(nproc)"
          install -m 0755 \
            atf-tools/lzma-4.65/CPP/7zip/Compress/LZMA_Alone/lzma \
            atf-tools/lzma

      - name: Build BL2 and BL31
        env:
          AARCH64_CROSS_COMPILE: aarch64-linux-gnu-
          ARM32_CROSS_COMPILE: ${{ github.workspace }}/atf-tools/${{ env.BL2_TOOLCHAIN_NAME }}/bin/arm-none-eabi-
          ATF_DIR: ${{ github.workspace }}/trusted-firmware-a-build
          LZMA: ${{ github.workspace }}/atf-tools/lzma
          MBEDTLS_DIR: ${{ github.workspace }}/mbedtls-3.4.1
          OUTPUT_DIR: ${{ github.workspace }}/out/atf
        run: |
          set -euo pipefail
          board/airoha/xg2010g/atf/build-atf.sh
          test -s out/atf/bl2.bin
          test -s out/atf/bl31.bin

          # BL2 先把 BL33 载荷读入固定解压缓冲区，再展开到最终执行地址。
          "$LZMA" e u-boot.bin out/atf/bl33.bin
          python3 scripts/ci/validate-bl33.py --raw u-boot.bin --payload out/atf/bl33.bin
          ls -la out/atf/bl2.bin out/atf/bl31.bin out/atf/bl33.bin

      - name: Prepare signing inputs
        id: signing
        env:
          BOARD: ${{ matrix.board }}
          BOARD_UPPER: ${{ steps.board_ids.outputs.board_upper }}
          FIP_OFFSET_DEC: ${{ steps.params.outputs.fip_offset_dec }}
          # GitHub Actions expressions cannot concatenate strings to form a
          # vars/secrets indexer key, so each per-board signing input is
          # enumerated by board name in env. The shell picks the one
          # matching $BOARD_UPPER. Add new boards here AND extend the case
          # statement below.
          MTD0_PREFIX_B64_XG2010G: ${{ secrets.XG2010G_MTD0_PREFIX_B64 }}
          MTD0_PREFIX_B64_XR1710G: ${{ secrets.XR1710G_MTD0_PREFIX_B64 }}
          MTD0_PREFIX_SHA256_XG2010G: ${{ vars.XG2010G_MTD0_PREFIX_SHA256 }}
          MTD0_PREFIX_SHA256_XR1710G: ${{ vars.XR1710G_MTD0_PREFIX_SHA256 }}
          MTD0_PREFIX_URL_XG2010G: ${{ secrets.XG2010G_MTD0_PREFIX_URL || vars.XG2010G_MTD0_PREFIX_URL }}
          MTD0_PREFIX_URL_XR1710G: ${{ secrets.XR1710G_MTD0_PREFIX_URL || vars.XR1710G_MTD0_PREFIX_URL }}
          TB_PRIVATE_KEY_XG2010G: ${{ secrets.XG2010G_TB_PRIVATE_KEY }}
          TB_PRIVATE_KEY_XR1710G: ${{ secrets.XR1710G_TB_PRIVATE_KEY }}
          TB_PRIVATE_KEY_B64_XG2010G: ${{ secrets.XG2010G_TB_PRIVATE_KEY_B64 }}
          TB_PRIVATE_KEY_B64_XR1710G: ${{ secrets.XR1710G_TB_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          BOARD_UPPER="${{ steps.board_ids.outputs.board_upper }}"
          case "$BOARD_UPPER" in
            XG2010G)
              MTD0_PREFIX_B64="${MTD0_PREFIX_B64_XG2010G:-}"
              MTD0_PREFIX_SHA256="${MTD0_PREFIX_SHA256_XG2010G:-}"
              MTD0_PREFIX_URL="${MTD0_PREFIX_URL_XG2010G:-}"
              TB_PRIVATE_KEY="${TB_PRIVATE_KEY_XG2010G:-}"
              TB_PRIVATE_KEY_B64="${TB_PRIVATE_KEY_B64_XG2010G:-}"
              ;;
            XR1710G)
              MTD0_PREFIX_B64="${MTD0_PREFIX_B64_XR1710G:-}"
              MTD0_PREFIX_SHA256="${MTD0_PREFIX_SHA256_XR1710G:-}"
              MTD0_PREFIX_URL="${MTD0_PREFIX_URL_XR1710G:-}"
              TB_PRIVATE_KEY="${TB_PRIVATE_KEY_XR1710G:-}"
              TB_PRIVATE_KEY_B64="${TB_PRIVATE_KEY_B64_XR1710G:-}"
              ;;
            *)
              echo "Unknown board for signing: ${BOARD_UPPER}" >&2
              exit 1
              ;;
          esac
          mkdir -p signing certs out
          missing=()

          # The vendor mtd0 prefix is per-board BootROM-specific; never share
          # XG2010G's prefix with XR1710G. Refuse to fall back to any other
          # board's bundled asset and fail loudly if nothing is configured.
          BUNDLED_ASSET_DIR="board/airoha/${BOARD}/firmware"

          restore_binary() {
            local label="$1"
            local b64="$2"
            local url="$3"
            local out="$4"
            local sha="$5"

            if [ -n "$b64" ]; then
              printf '%s' "$b64" | base64 -d > "$out"
            elif [ -n "$url" ]; then
              curl -fsSL -o "$out" "$url"
            else
              return 1
            fi

            if [ ! -s "$out" ]; then
              echo "${label} was restored but is empty" >&2
              return 1
            fi
            if [ -n "$sha" ]; then
              printf '%s  %s\n' "$sha" "$out" | sha256sum -c -
            fi
            return 0
          }

          if [ -n "$TB_PRIVATE_KEY_B64" ]; then
            printf '%s' "$TB_PRIVATE_KEY_B64" | base64 -d > signing/tb_key.pem
          elif [ -n "$TB_PRIVATE_KEY" ]; then
            export TB_PRIVATE_KEY
            python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path

          key = os.environ.get("TB_PRIVATE_KEY", "").replace("\\n", "\n").strip()
          if not key:
              raise SystemExit("TB_PRIVATE_KEY is set in shell but was not passed to Python")
          begin = "-----BEGIN PRIVATE KEY-----"
          end = "-----END PRIVATE KEY-----"
          if begin in key and end in key and "\n" not in key:
              body = key.split(begin, 1)[1].split(end, 1)[0]
              body = re.sub(r"\s+", "", body)
              key = begin + "\n" + "\n".join(textwrap.wrap(body, 64)) + "\n" + end
          Path("signing/tb_key.pem").write_text(key + "\n", encoding="ascii", newline="\n")
          PY
          else
            missing+=("${BOARD_UPPER}_TB_PRIVATE_KEY or ${BOARD_UPPER}_TB_PRIVATE_KEY_B64")
          fi

          if [ -f signing/tb_key.pem ]; then
            chmod 600 signing/tb_key.pem
            openssl pkey -in signing/tb_key.pem -noout
          fi

          cp out/atf/bl2.bin signing/bl2.bin
          cp out/atf/bl31.bin signing/bl31.bin
          if [ -n "$MTD0_PREFIX_B64$MTD0_PREFIX_URL" ]; then
            restore_binary "mtd0 prefix" "$MTD0_PREFIX_B64" "$MTD0_PREFIX_URL" signing/mtd0-prefix.bin "$MTD0_PREFIX_SHA256" \
              || missing+=("${BOARD_UPPER}_MTD0_PREFIX_B64 or ${BOARD_UPPER}_MTD0_PREFIX_URL")
          elif [ -f "${BUNDLED_ASSET_DIR}/mtd0-prefix.bin" ]; then
            cp "${BUNDLED_ASSET_DIR}/mtd0-prefix.bin" signing/mtd0-prefix.bin
            # Bundled prefixes ship with a ${BOARD_UPPER}_MTD0_PREFIX_SHA256
            # variable too; if it is missing we trust the bundled file and
            # only warn.
            if [ -n "$MTD0_PREFIX_SHA256" ]; then
              printf '%s  %s\n' "$MTD0_PREFIX_SHA256" signing/mtd0-prefix.bin | sha256sum -c -
            else
              echo "warning: ${BOARD_UPPER}_MTD0_PREFIX_SHA256 not set; trusting bundled mtd0-prefix.bin" >&2
            fi
          else
            missing+=("${BOARD_UPPER}_MTD0_PREFIX_B64 / ${BOARD_UPPER}_MTD0_PREFIX_URL / ${BUNDLED_ASSET_DIR}/mtd0-prefix.bin")
          fi

          if [ -f signing/mtd0-prefix.bin ]; then
            prefix_size=$(stat -c%s signing/mtd0-prefix.bin)
            if (( prefix_size != FIP_OFFSET_DEC )); then
              echo "mtd0 prefix must be exactly ${FIP_OFFSET_DEC} bytes, got ${prefix_size}" >&2
              exit 1
            fi
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing signing inputs:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "::error::Signing inputs are required for all build modes, including test. Set the missing vars/secrets in repo settings and re-run, or supply an mtd0-prefix URL/B64." >&2
            exit 1
          fi

          for image in signing/bl2.bin signing/bl31.bin signing/mtd0-prefix.bin; do
            test -s "$image"
            ls -la "$image"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate Trusted Boot certificates and FIP
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          BOARD: ${{ matrix.board }}
          FIP_ALIGN: ${{ steps.params.outputs.fip_align }}
          NTFW_NVCTR: ${{ steps.params.outputs.ntfw_nvctr }}
          TFW_NVCTR: ${{ steps.params.outputs.tfw_nvctr }}
        run: |
          set -euo pipefail
          CERT_CREATE=trusted-firmware-a/tools/cert_create/cert_create
          FIPTOOL=trusted-firmware-a/tools/fiptool/fiptool

          check_fip_size() {
            local image=$1
            local limit=$2
            local size
            size=$(stat -c%s "$image")
            if (( size > limit )); then
              echo "$image is ${size} bytes; limit is ${limit} bytes" >&2
              return 1
            fi
          }

          "$CERT_CREATE" -n \
            --rot-key signing/tb_key.pem \
            --trusted-world-key signing/tb_key.pem \
            --non-trusted-world-key signing/tb_key.pem \
            --soc-fw-key signing/tb_key.pem \
            --nt-fw-key signing/tb_key.pem \
            --tfw-nvctr "$TFW_NVCTR" \
            --ntfw-nvctr "$NTFW_NVCTR" \
            --tb-fw signing/bl2.bin \
            --soc-fw signing/bl31.bin \
            --nt-fw out/atf/bl33.bin \
            --tb-fw-cert certs/tb_fw.crt \
            --trusted-key-cert certs/trusted_key.crt \
            --soc-fw-key-cert certs/soc_fw_key.crt \
            --soc-fw-cert certs/soc_fw.crt \
            --nt-fw-key-cert certs/nt_fw_key.crt \
            --nt-fw-cert certs/nt_fw.crt

          "$FIPTOOL" create \
            --align "$FIP_ALIGN" \
            --tb-fw signing/bl2.bin \
            --soc-fw signing/bl31.bin \
            --nt-fw out/atf/bl33.bin \
            --trusted-key-cert certs/trusted_key.crt \
            --soc-fw-key-cert certs/soc_fw_key.crt \
            --nt-fw-key-cert certs/nt_fw_key.crt \
            --tb-fw-cert certs/tb_fw.crt \
            --soc-fw-cert certs/soc_fw.crt \
            --nt-fw-cert certs/nt_fw.crt \
            out/fip-${BOARD}-signed.bin

          "$FIPTOOL" info out/fip-${BOARD}-signed.bin | tee out/fip-info.txt
          "$FIPTOOL" unpack --force \
            --nt-fw out/fip-bl33-check.bin \
            out/fip-${BOARD}-signed.bin
          cmp out/fip-bl33-check.bin out/atf/bl33.bin
          rm -f out/fip-bl33-check.bin
          check_fip_size out/fip-${BOARD}-signed.bin "$((BL23_FIP_MAX_SIZE))"

          # X 模式第一阶段需要同时携带 BL2 与 tb-fw 证书。
          "$FIPTOOL" create \
            --align "$FIP_ALIGN" \
            --tb-fw signing/bl2.bin \
            --tb-fw-cert certs/tb_fw.crt \
            out/ubi-preloader.bin

          "$FIPTOOL" info out/ubi-preloader.bin | tee out/ubi-preloader-fip-info.txt
          grep -q 'Trusted Boot Firmware BL2:' out/ubi-preloader-fip-info.txt
          grep -q 'Trusted Boot Firmware BL2 certificate:' out/ubi-preloader-fip-info.txt
          check_fip_size out/ubi-preloader.bin "$((BL2_XMODEM_MAX_SIZE))"

          "$FIPTOOL" create \
            --align "$FIP_ALIGN" \
            --soc-fw signing/bl31.bin \
            --nt-fw out/atf/bl33.bin \
            --trusted-key-cert certs/trusted_key.crt \
            --soc-fw-key-cert certs/soc_fw_key.crt \
            --nt-fw-key-cert certs/nt_fw_key.crt \
            --soc-fw-cert certs/soc_fw.crt \
            --nt-fw-cert certs/nt_fw.crt \
            out/ubi-bl31-uboot.fip

          "$FIPTOOL" info out/ubi-bl31-uboot.fip | tee out/ubi-bl31-uboot-fip-info.txt
          "$FIPTOOL" unpack --force \
            --nt-fw out/recovery-bl33-check.bin \
            out/ubi-bl31-uboot.fip
          cmp out/recovery-bl33-check.bin out/atf/bl33.bin
          rm -f out/recovery-bl33-check.bin
          check_fip_size out/ubi-bl31-uboot.fip "$((BL23_FIP_MAX_SIZE))"

          # 应急 bootext 垫片：给 BL2 加 BootROM XMODEM 加载头，格式对照原厂
          # bootext.ram（magic 0xAA640001/0x12345678 + BL2 UUID + 载荷偏移/大小，
          # 其余补零；0x38 校验区原厂非零，但 ImmortalWrt 为零可用，这里取零）。
          python3 scripts/ci/bootext-bl2.py \
            --bl2 signing/bl2.bin \
            --output out/bootext-bl2.bin
          test -s out/bootext-bl2.bin

      - name: Compose 2 MiB mtd0 image
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          BOARD: ${{ matrix.board }}
          FIP_OFFSET: ${{ steps.params.outputs.fip_offset }}
          MTD0_SIZE: ${{ steps.params.outputs.mtd0_size }}
        run: |
          set -euo pipefail
          python3 scripts/ci/compose-mtd0.py \
            --prefix signing/mtd0-prefix.bin \
            --fip "out/fip-${BOARD}-signed.bin" \
            --output "out/mtd0-bootloader-${BOARD}-signed.bin"
          test "$(stat -c%s "out/mtd0-bootloader-${BOARD}-signed.bin")" = "${{ steps.params.outputs.mtd0_size_dec }}"

      - name: Prepare artifacts
        id: artifact
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          AIROHA_ATF_BUILD_REF: ${{ env.AIROHA_ATF_REF }}
          ATF_BUILD_BASE_REF: ${{ env.ATF_BASE_REF }}
          BL2_BUILD_TOOLCHAIN: ${{ env.BL2_TOOLCHAIN_NAME }}
          BOARD: ${{ matrix.board }}
          BOARD_UPPER: ${{ steps.board_ids.outputs.board_upper }}
          BUILD_MODE: ${{ steps.mode.outputs.value }}
          COMMIT_SHORT: ${{ steps.version.outputs.commit }}
          DATE_STAMP: ${{ steps.version.outputs.date }}
          FIP_ALIGN: ${{ steps.params.outputs.fip_align }}
          FIP_OFFSET: ${{ steps.params.outputs.fip_offset }}
          MTD0_SIZE: ${{ steps.params.outputs.mtd0_size }}
          RELEASE_DATE: ${{ steps.version.outputs.release_date }}
          SIGNED_READY: ${{ steps.signing.outputs.ready }}
          TFA_REF: ${{ steps.params.outputs.tfa_ref }}
          TFA_MBEDTLS_REF: ${{ env.MBEDTLS_REF }}
          UBOOT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${SIGNED_READY:-false}" != "true" ]; then
            echo "Signed mtd0 artifacts are required, but signing did not complete." >&2
            exit 1
          fi

          board="${BOARD}"
          artifact_name="${board}-mtd0-${DATE_STAMP}-${COMMIT_SHORT}"
          mtd0_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-mtd0-signed.bin"
          fip_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-fip-signed.bin"
          preloader_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-ubi-preloader.bin"
          recovery_fip_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-ubi-bl31-uboot.fip"
          bootext_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-bootext-bl2.bin"
          bl31_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-bl31.bin"
          uboot_raw_name="${board}-${RELEASE_DATE}-${COMMIT_SHORT}-u-boot-raw.bin"
          mkdir -p build-output

          test -s "out/mtd0-bootloader-${board}-signed.bin"
          test -s "out/fip-${board}-signed.bin"
          test -s out/ubi-preloader.bin
          test -s out/ubi-bl31-uboot.fip
          test -s out/bootext-bl2.bin
          test -s signing/bl2.bin
          test -s signing/bl31.bin
          test -s u-boot.bin

          cp u-boot.bin "build-output/${uboot_raw_name}"
          cp u-boot.dtb "build-output/${board}-u-boot.dtb" 2>/dev/null || true
          cp u-boot.img "build-output/${board}-u-boot.img" 2>/dev/null || true
          cp tools/mkimage build-output/mkimage 2>/dev/null || true
          cp "out/mtd0-bootloader-${board}-signed.bin" "build-output/${mtd0_name}"
          cp "out/fip-${board}-signed.bin" "build-output/${fip_name}"
          cp out/ubi-preloader.bin "build-output/${preloader_name}"
          cp signing/bl31.bin "build-output/${bl31_name}"
          cp out/ubi-bl31-uboot.fip "build-output/${recovery_fip_name}"
          cp out/bootext-bl2.bin "build-output/${bootext_name}"
          cp out/fip-info.txt "build-output/${board}-fip-info.txt"
          cp out/ubi-preloader-fip-info.txt "build-output/${board}-ubi-preloader-fip-info.txt"
          cp out/ubi-bl31-uboot-fip-info.txt "build-output/${board}-ubi-bl31-uboot-fip-info.txt"
          {
            echo "Board: ${board} (${BOARD_UPPER})"
            echo "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Commit short: ${COMMIT_SHORT}"
            echo "Build mode: ${BUILD_MODE}"
            echo "U-Boot version: ${UBOOT_VERSION}"
            echo "Signed mtd0: true"
            echo "Signing: required"
            echo "TF-A tooling ref: ${TFA_REF}"
            echo "Airoha TF-A base ref: ${ATF_BUILD_BASE_REF}"
            echo "Airoha TF-A overlay ref: ${AIROHA_ATF_BUILD_REF}"
            echo "Airoha TF-A Mbed TLS ref: ${TFA_MBEDTLS_REF}"
            echo "BL2 toolchain: ${BL2_BUILD_TOOLCHAIN}"
            echo "mtd0 size: ${MTD0_SIZE}"
            echo "FIP offset: ${FIP_OFFSET}"
            echo "FIP alignment: ${FIP_ALIGN}"
            echo "Raw U-Boot/BL33: ${uboot_raw_name}"
            echo "mtd0 image: ${mtd0_name}"
            echo "FIP image: ${fip_name}"
            echo "Recovery BL2/preloader signed FIP: ${preloader_name}"
            echo "Recovery BL31+U-Boot FIP: ${recovery_fip_name}"
            echo "BootROM XMODEM first-stage BL2 (bootext fallback): ${bootext_name}"
            echo "Raw BL31: ${bl31_name}"
            echo "Certificate chain: BL2 tb-fw, BL31 soc-fw, U-Boot BL33 nt-fw"
            echo "Certificate files: generated during signing, not uploaded"
          } > "build-output/${board}-${RELEASE_DATE}-${COMMIT_SHORT}-build-info.txt"

          sums_file=$(mktemp)
          (cd build-output && find . -maxdepth 1 -type f ! -name '*sha256sums*' -print0 | sort -z | xargs -0 sha256sum) > "$sums_file"
          mv "$sums_file" "build-output/${board}-${RELEASE_DATE}-${COMMIT_SHORT}-sha256sums.txt"

          {
            echo "artifact_name=${artifact_name}"
            echo "bl31_name=${bl31_name}"
            echo "mtd0_name=${mtd0_name}"
            echo "fip_name=${fip_name}"
            echo "preloader_name=${preloader_name}"
            echo "recovery_fip_name=${recovery_fip_name}"
            echo "tag=${RELEASE_DATE}-${COMMIT_SHORT}"
            echo "uboot_raw_name=${uboot_raw_name}"
          } >> "$GITHUB_OUTPUT"

          ls -la build-output

      - name: Upload artifacts
        if: ${{ steps.signing.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: build-output/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed mtd0 release
    needs: [select-boards, build]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.build_mode != 'test' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-output

      - name: Flatten and verify per-board assets
        env:
          BOARDS_JSON: ${{ needs.select-boards.outputs.boards }}
          COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_DATE: ${{ needs.build.outputs.release_date }}
        run: |
          set -euo pipefail
          # Each matrix leg uploads its own artifact directory; flatten them
          # into release-output/ for a single combined release.
          find release-output -mindepth 2 -maxdepth 2 -type f -exec mv -f {} release-output/ \;
          find release-output -mindepth 1 -maxdepth 1 -type d -empty -delete

          mapfile -t BOARDS < <(jq -r '.[]' <<<"$BOARDS_JSON")
          for board in "${BOARDS[@]}"; do
            for suffix in mtd0-signed.bin fip-signed.bin ubi-preloader.bin ubi-bl31-uboot.fip bootext-bl2.bin bl31.bin u-boot-raw.bin sha256sums.txt build-info.txt; do
              file="release-output/${board}-${RELEASE_DATE}-${COMMIT}-${suffix}"
              if [ ! -s "$file" ]; then
                echo "Release asset not found: $file" >&2
                exit 1
              fi
            done
          done

      - name: Create or update GitHub Release
        env:
          BOARDS_JSON: ${{ needs.select-boards.outputs.boards }}
          COMMIT: ${{ needs.build.outputs.commit }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DATE: ${{ needs.build.outputs.release_date }}
          RELEASE_MODE: ${{ needs.build.outputs.build_mode }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TITLE: Brightspeed Gemtek signed mtd0-${{ needs.build.outputs.release_date }}-g${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t BOARDS < <(jq -r '.[]' <<<"$BOARDS_JSON")
          paths=()
          for board in "${BOARDS[@]}"; do
            for suffix in mtd0-signed.bin fip-signed.bin ubi-preloader.bin ubi-bl31-uboot.fip bootext-bl2.bin bl31.bin u-boot-raw.bin sha256sums.txt build-info.txt; do
              paths+=("release-output/${board}-${RELEASE_DATE}-${COMMIT}-${suffix}")
            done
          done

          boards_line=""
          for board in "${BOARDS[@]}"; do
            case "$board" in
              xg2010g) desc='`xg2010g` (Brightspeed Gemtek XG2010G)' ;;
              xr1710g) desc='`xr1710g` (Brightspeed Gemtek XR1710G)' ;;
              *) desc="\`${board}\`" ;;
            esac
            if [ -n "$boards_line" ]; then
              boards_line+=", "
            fi
            boards_line+="$desc"
          done

          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          Automated signed bootloader build from commit [\`${COMMIT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          **Release channel:** ${RELEASE_MODE}

          **Boards:** ${boards_line}

          ## Files (per selected board)

          - \`<board>-${RELEASE_DATE}-${COMMIT}-mtd0-signed.bin\` - 2 MiB \`/dev/mtd0\` bootloader image. Contains preserved prefix, BL2, BL31, signed certificates, and this repository's U-Boot as BL33.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-fip-signed.bin\` - signed FIP only, placed at the configured mtd0 FIP offset.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-ubi-preloader.bin\` - signed FIP containing the compiled BL2 and its content certificate for XMODEM recovery.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-ubi-bl31-uboot.fip\` - BL31 + U-Boot FIP for the second XMODEM recovery transfer.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-bootext-bl2.bin\` - BootROM XMODEM first-stage BL2 with the Airoha load header (emergency fallback for the vendor bootext.ram; not device-verified, prefer the vendor file).
          - \`<board>-${RELEASE_DATE}-${COMMIT}-bl31.bin\` - compiled BL31 compressed with the Airoha LZMA container.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-u-boot-raw.bin\` - raw U-Boot/BL33 from this build.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-sha256sums.txt\` - SHA256 checksums for this board's artifacts.
          - \`<board>-${RELEASE_DATE}-${COMMIT}-build-info.txt\` - build metadata for this board.

          ## Flash boundary

          Only write \`<board>-...-mtd0-signed.bin\` to the \`bootloader\` partition range \`0x00000000-0x00200000\` after serial-console validation. Do not write to \`uenv\` \`0x00200000-0x00400000\` or \`dsd\` \`0x00400000-0x00600000\`. Use the image matching your board.

          ## Safety note

          These images use the pinned Airoha TF-A source, the preserved mtd0 prefix, and the configured signing key. Confirm the target boot policy before flashing.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_MODE" = "pre-release" ]; then
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$notes_file" \
                --prerelease \
                --latest=false
            else
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$notes_file" \
                --prerelease=false \
                --latest
            fi
          else
            create_args=("--target" "$GITHUB_SHA" "--title" "$RELEASE_TITLE" "--notes-file" "$notes_file")
            if [ "$RELEASE_MODE" = "pre-release" ]; then
              create_args+=("--prerelease" "--latest=false")
            else
              create_args+=("--latest")
            fi
            gh release create "$RELEASE_TAG" "${create_args[@]}"
          fi

          gh release upload "$RELEASE_TAG" "${paths[@]}" --clobber
